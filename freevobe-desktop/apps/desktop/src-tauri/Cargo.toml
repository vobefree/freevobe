[package]
name = "freevobe-desktop"
version = "0.2.5"
description = "Freevobe – lokal-first vibecoding med Ollama"
authors = ["Freevobe"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
default-run = "freevobe-desktop"

[lib]
name = "freevobe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Används av Tauri för att slå på snabbare byggen under utveckling.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
