name: Applicera agent-loop-fix
on:
  push:
    paths:
      - '.github/workflows/apply-loop-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applicera patcharna
        run: |
          git apply --check .github/fix-a.patch
          git apply .github/fix-a.patch
          git apply --check .github/fix-b.patch
          git apply .github/fix-b.patch
          git apply --check .github/fix-c.patch
          git apply .github/fix-c.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: freevobe-desktop/package-lock.json
      - name: Installera
        working-directory: freevobe-desktop
        run: npm ci
      - name: Verifiera
        working-directory: freevobe-desktop
        run: npm run verify
      - name: Committa och pusha
        run: |
          git config user.name "Freevobe"
          git config user.email "vobefree@users.noreply.github.com"
          git rm --quiet .github/fix-a.patch .github/fix-b.patch .github/fix-c.patch .github/workflows/apply-loop-fix.yml
          git add -A
          git commit -m "Höj varvtaket, acceptera old_string och förklara saknat tool calling"
          git push origin HEAD:main
