name: Applicera leveransfix
on:
  push:
    paths:
      - '.github/deliver-fix.patch'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applicera patchen
        run: |
          git apply --check .github/deliver-fix.patch
          git apply .github/deliver-fix.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: freevobe-desktop/package-lock.json
      - name: Installera
        working-directory: freevobe-desktop
        run: npm ci
      - name: Verifiera
        working-directory: freevobe-desktop
        run: npm run verify
      - name: Committa och pusha
        run: |
          git config user.name "Freevobe"
          git config user.email "vobefree@users.noreply.github.com"
          git rm --quiet .github/deliver-fix.patch .github/workflows/apply-deliver-fix.yml
          git add -A
          git commit -m "Skriv filerna ur modellens svar när den bara producerar kod"
          git push origin HEAD:main
