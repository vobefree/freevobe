# Bygger installerarna för Windows, macOS och Linux när en tagg `v*` pushas och lägger dem i en
# release. Samma kommandon som docs/releasing.md beskriver – inget som bara finns i CI.
#
# Releaseappen blir publik (inte ett utkast), eftersom nedladdningssidan läser den senaste
# publicerade releasen via GitHub-API:t. Arbetet är idempotent: körs taggen om laddas filerna upp
# till samma release i stället för att releasen skapas på nytt.
name: Release

on:
  push:
    tags: ['v*']
  # Gör det möjligt att testa bygget utan att pusha en tagg. Filerna hamnar då som artefakter.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Samma version som sidecar-binären är verifierad med lokalt (Node:s SEA kräver >= 22.5).
  NODE_VERSION: 24

jobs:
  verify:
    name: Kontrollera taggen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: freevobe-desktop/package-lock.json
      - name: Versionen i tauri.conf.json måste matcha taggen
        working-directory: freevobe-desktop
        run: |
          set -euo pipefail
          # Vid en manuell körning finns ingen tagg att jämföra mot; då räcker det att bygget går
          # igenom och filerna hamnar som artefakter.
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "Manuell körning – hoppar över taggkontrollen och publicerar inget."
            exit 0
          fi
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Taggen $GITHUB_REF_NAME matchar inte appens version $version (src-tauri/tauri.conf.json)." >&2
            echo "Höj versionen i package.json, apps/desktop/package.json och src-tauri/tauri.conf.json först." >&2
            exit 1
          fi
          echo "Version $version stämmer med taggen $GITHUB_REF_NAME."
      - run: npm ci
        working-directory: freevobe-desktop
      - name: Typecheck, lint och tester
        working-directory: freevobe-desktop
        run: npm run verify

  # Learn är en egen app, inte en sida på sajten: den publiceras som en enda HTML-fil som går att
  # ladda ner, öppna offline och spela utan server. Samma fil som `npm run package` ger lokalt.
  learn:
    name: Freevobe Learn (.html)
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freevobe-learn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: freevobe-learn/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: learn-app
          path: freevobe-learn/release/freevobe-learn.html
          if-no-files-found: error

  windows:
    name: Windows (.exe)
    needs: verify
    runs-on: windows-latest
    # Authenticode-signering av installeraren. Hemligheterna är valfria: utan dem blir bygget
    # osignerat och SmartScreen varnar vid start, men releasen publiceras ändå. Se docs/releasing.md.
    env:
      # Hemligheterna ligger i jobbets miljö under FREEVOBE_-namn och flyttas till sina riktiga
      # namn av signeringssteget – bara när de har ett värde. Skälet står där.
      FREEVOBE_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      FREEVOBE_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: freevobe-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freevobe-desktop/apps/desktop/src-tauri
      - run: npm ci
        working-directory: freevobe-desktop
      - name: Bygg agenten och sidecar-binären
        working-directory: freevobe-desktop
        run: npm run sidecar:build
      - name: Förbered signering av installeraren
        shell: pwsh
        working-directory: freevobe-desktop
        run: |
          $ErrorActionPreference = 'Stop'
          # Konfigurationen skrivs utanför repot och pekas ut med en absolut sökväg: Tauri körs med
          # workspace-katalogen (apps/desktop) som arbetskatalog och letar annars efter filen där.
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri-signing.conf.json'
          "FREEVOBE_TAURI_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if ([string]::IsNullOrWhiteSpace($env:FREEVOBE_WINDOWS_CERTIFICATE)) {
            '{}' | Set-Content -Path $configPath -Encoding utf8
            "FREEVOBE_WINDOWS_SIGNED=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "::warning::WINDOWS_CERTIFICATE saknas – installeraren blir osignerad och SmartScreen varnar vid start (se docs/releasing.md)."
            exit 0
          }

          # Certifikatet skickas in som base64 (radbrytningar tillåtna) och importeras i runnerkontots
          # arkiv – det är så Tauri hittar det, via tumavtrycket.
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String(($env:FREEVOBE_WINDOWS_CERTIFICATE -replace '\s', '')))
          $password = ConvertTo-SecureString -String $env:FREEVOBE_WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force

          # Skrivs som en delvis config som Tauri djupmergar in (RFC 7396), så bundle.windows.nsis i
          # tauri.conf.json behålls. Tidsstämpeln krävs för att signaturen ska gälla även efter det att
          # certifikatet gått ut; DigiCert fungerar för de flesta utfärdare – byt vid behov.
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
              }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content -Path $configPath -Encoding utf8

          "FREEVOBE_WINDOWS_SIGNED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Importerade $($cert.Subject) ($($cert.Thumbprint))."

      - name: Bygg installeraren
        shell: pwsh
        working-directory: freevobe-desktop
        run: >-
          npm run tauri --workspace @freevobe/desktop -- build
          --bundles nsis --config "$env:FREEVOBE_TAURI_CONFIG"
      - name: Döp artefakten till nedladdningssidans filnamn
        shell: bash
        working-directory: freevobe-desktop
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe \
            "dist-release/Freevobe_${GITHUB_REF_NAME}_x64-setup.exe"
          ls -l dist-release
      - name: Verifiera signaturen
        shell: pwsh
        working-directory: freevobe-desktop
        run: |
          $ErrorActionPreference = 'Stop'

          $files = @(Get-ChildItem 'dist-release/*-setup.exe' | ForEach-Object { $_.FullName })
          # Huvudbinären får sitt namn av mainBinaryName i tauri.conf.json, inte av craten.
          $mainExe = 'apps/desktop/src-tauri/target/release/Freevobe.exe'
          if (Test-Path $mainExe) { $files += (Resolve-Path $mainExe).Path }
          if ($files.Count -eq 0) { throw 'Hittade inga byggda filer att verifiera.' }

          if ($env:FREEVOBE_WINDOWS_SIGNED -ne 'true') {
            Write-Host '::warning::Installeraren är osignerad (inget certifikat konfigurerat).'
            exit 0
          }

          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') {
              throw "Signaturen för $file är inte giltig: $($signature.Status) – $($signature.StatusMessage)"
            }
            Write-Host "$(Split-Path -Leaf $file): giltig signatur av $($signature.SignerCertificate.Subject)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: freevobe-desktop/dist-release/*
          if-no-files-found: error

  macos:
    name: macOS (.dmg, Apple Silicon)
    needs: verify
    runs-on: macos-latest
    # Koden-signering och notarisering. Alla är valfria: utan dem blir appen osignerad och Gatekeeper
    # varnar vid start, men releasen publiceras ändå. Se docs/releasing.md. Namnen har FREEVOBE_-
    # prefix och flyttas till sina riktiga namn av signeringssteget – bara när de har ett värde.
    env:
      FREEVOBE_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      FREEVOBE_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      FREEVOBE_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      FREEVOBE_APPLE_ID: ${{ secrets.APPLE_ID }}
      FREEVOBE_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      FREEVOBE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      FREEVOBE_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      FREEVOBE_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      FREEVOBE_APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: freevobe-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freevobe-desktop/apps/desktop/src-tauri
      - run: npm ci
        working-directory: freevobe-desktop
      - name: Bygg agenten och sidecar-binären
        working-directory: freevobe-desktop
        run: npm run sidecar:build
      - name: Förbered signering
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          # Tauri läser APPLE_*-variablerna själv under bygget, så de behöver sina riktiga namn – men
          # bara när de har ett värde: en tom APPLE_CERTIFICATE eller APPLE_SIGNING_IDENTITY tolkas
          # som "signera med ett tomt certifikat" och fäller bygget. Därför FREEVOBE_-namnen i
          # jobbets miljö och en flytt hit, enbart för de variabler som faktiskt är satta.
          expose() {
            local name="$1"
            local value="${2:-}"
            [ -n "$value" ] || return 0
            printf '%s=%s\n' "$name" "$(printf '%s' "$value" | tr -d '\n')" >> "$GITHUB_ENV"
          }
          # Notarisering med App Store Connect-nyckel kräver .p8-filen på disk. Den skickas in som
          # base64 och läggs i runnerkontots tempkatalog – aldrig i repot.
          if [ -n "${FREEVOBE_APPLE_API_KEY_P8_BASE64:-}" ]; then
            printf '%s' "$FREEVOBE_APPLE_API_KEY_P8_BASE64" | tr -d '\n' \
              | openssl base64 -d -A > "$RUNNER_TEMP/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey.p8"
            expose APPLE_API_KEY_PATH "$RUNNER_TEMP/AuthKey.p8"
          fi
          expose APPLE_CERTIFICATE "${FREEVOBE_APPLE_CERTIFICATE:-}"
          expose APPLE_CERTIFICATE_PASSWORD "${FREEVOBE_APPLE_CERTIFICATE_PASSWORD:-}"
          expose APPLE_SIGNING_IDENTITY "${FREEVOBE_APPLE_SIGNING_IDENTITY:-}"
          expose APPLE_ID "${FREEVOBE_APPLE_ID:-}"
          expose APPLE_PASSWORD "${FREEVOBE_APPLE_PASSWORD:-}"
          expose APPLE_TEAM_ID "${FREEVOBE_APPLE_TEAM_ID:-}"
          expose APPLE_API_KEY "${FREEVOBE_APPLE_API_KEY:-}"
          expose APPLE_API_ISSUER "${FREEVOBE_APPLE_API_ISSUER:-}"
          if [ -n "${FREEVOBE_APPLE_CERTIFICATE:-}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_CERTIFICATE saknas – appen blir osignerad och Gatekeeper varnar vid start (se docs/releasing.md)."
          fi
          if [ -n "${FREEVOBE_APPLE_ID:-}" ] || [ -n "${FREEVOBE_APPLE_API_KEY:-}" ]; then
            echo "notary=true" >> "$GITHUB_OUTPUT"
          else
            echo "notary=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Inga notariseringsuppgifter (APPLE_ID eller APPLE_API_KEY) – dmg:n lämnas onotariserad."
          fi

      - name: Bygg installeraren
        working-directory: freevobe-desktop
        run: >-
          npm run tauri --workspace @freevobe/desktop -- build
          --target aarch64-apple-darwin --bundles dmg
      - name: Döp artefakten till nedladdningssidans filnamn
        shell: bash
        working-directory: freevobe-desktop
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
            "dist-release/Freevobe_${GITHUB_REF_NAME}_aarch64.dmg"
          ls -l dist-release
      - name: Notarisera och häfta fast biljetten på dmg:n
        if: steps.signing.outputs.signed == 'true' && steps.signing.outputs.notary == 'true'
        shell: bash
        working-directory: freevobe-desktop
        run: |
          set -euo pipefail
          dmg=$(ls dist-release/*.dmg)
          # Tauri notariserar och häftar appen, men inte dmg-filen (tauri-apps/tauri#7533). Utan
          # biljett på själva filen varnar Gatekeeper den som laddar ner den.
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          else
            auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi
          result=$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --output-format json)
          printf '%s\n' "$result"
          if ! printf '%s' "$result" | grep -Eq '"status" *: *"Accepted"'; then
            echo "::error::Notariseringen av $dmg godkändes inte."
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          echo "Biljetten är fast häftad på $dmg."
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: freevobe-desktop/dist-release/*
          if-no-files-found: error

  # Intel-Macar: macos-latest är Apple Silicon, och sidobinären paketeras på byggmaskinens
  # arkitektur. Därför en egen Intel-runner i stället för en universal-binär (som skulle kräva
  # Rosetta för att ens kunna bygga agent-binären för x86_64).
  macos_intel:
    name: macOS (.dmg, Intel)
    needs: verify
    runs-on: macos-15-intel
    # En utgången runner får inte stoppa de andra filerna från att publiceras.
    continue-on-error: true
    # Samma signeringshemligheter som macos-jobbet (FREEVOBE_-prefix, se kommentaren där).
    env:
      FREEVOBE_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      FREEVOBE_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      FREEVOBE_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      FREEVOBE_APPLE_ID: ${{ secrets.APPLE_ID }}
      FREEVOBE_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      FREEVOBE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      FREEVOBE_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      FREEVOBE_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      FREEVOBE_APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: freevobe-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freevobe-desktop/apps/desktop/src-tauri
      - run: npm ci
        working-directory: freevobe-desktop
      - name: Bygg agenten och sidecar-binären
        working-directory: freevobe-desktop
        run: npm run sidecar:build
      - name: Förbered signering
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          # Tauri läser APPLE_*-variablerna själv under bygget, så de behöver sina riktiga namn – men
          # bara när de har ett värde: en tom APPLE_CERTIFICATE eller APPLE_SIGNING_IDENTITY tolkas
          # som "signera med ett tomt certifikat" och fäller bygget. Därför FREEVOBE_-namnen i
          # jobbets miljö och en flytt hit, enbart för de variabler som faktiskt är satta.
          expose() {
            local name="$1"
            local value="${2:-}"
            [ -n "$value" ] || return 0
            printf '%s=%s\n' "$name" "$(printf '%s' "$value" | tr -d '\n')" >> "$GITHUB_ENV"
          }
          # Notarisering med App Store Connect-nyckel kräver .p8-filen på disk. Den skickas in som
          # base64 och läggs i runnerkontots tempkatalog – aldrig i repot.
          if [ -n "${FREEVOBE_APPLE_API_KEY_P8_BASE64:-}" ]; then
            printf '%s' "$FREEVOBE_APPLE_API_KEY_P8_BASE64" | tr -d '\n' \
              | openssl base64 -d -A > "$RUNNER_TEMP/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey.p8"
            expose APPLE_API_KEY_PATH "$RUNNER_TEMP/AuthKey.p8"
          fi
          expose APPLE_CERTIFICATE "${FREEVOBE_APPLE_CERTIFICATE:-}"
          expose APPLE_CERTIFICATE_PASSWORD "${FREEVOBE_APPLE_CERTIFICATE_PASSWORD:-}"
          expose APPLE_SIGNING_IDENTITY "${FREEVOBE_APPLE_SIGNING_IDENTITY:-}"
          expose APPLE_ID "${FREEVOBE_APPLE_ID:-}"
          expose APPLE_PASSWORD "${FREEVOBE_APPLE_PASSWORD:-}"
          expose APPLE_TEAM_ID "${FREEVOBE_APPLE_TEAM_ID:-}"
          expose APPLE_API_KEY "${FREEVOBE_APPLE_API_KEY:-}"
          expose APPLE_API_ISSUER "${FREEVOBE_APPLE_API_ISSUER:-}"
          if [ -n "${FREEVOBE_APPLE_CERTIFICATE:-}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_CERTIFICATE saknas – appen blir osignerad och Gatekeeper varnar vid start (se docs/releasing.md)."
          fi
          if [ -n "${FREEVOBE_APPLE_ID:-}" ] || [ -n "${FREEVOBE_APPLE_API_KEY:-}" ]; then
            echo "notary=true" >> "$GITHUB_OUTPUT"
          else
            echo "notary=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Inga notariseringsuppgifter (APPLE_ID eller APPLE_API_KEY) – dmg:n lämnas onotariserad."
          fi

      - name: Bygg installeraren
        working-directory: freevobe-desktop
        run: >-
          npm run tauri --workspace @freevobe/desktop -- build
          --target x86_64-apple-darwin --bundles dmg
      - name: Döp artefakten till nedladdningssidans filnamn
        shell: bash
        working-directory: freevobe-desktop
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg \
            "dist-release/Freevobe_${GITHUB_REF_NAME}_x64.dmg"
          ls -l dist-release
      - name: Notarisera och häfta fast biljetten på dmg:n
        if: steps.signing.outputs.signed == 'true' && steps.signing.outputs.notary == 'true'
        shell: bash
        working-directory: freevobe-desktop
        run: |
          set -euo pipefail
          dmg=$(ls dist-release/*.dmg)
          # Tauri notariserar och häftar appen, men inte dmg-filen (tauri-apps/tauri#7533). Utan
          # biljett på själva filen varnar Gatekeeper den som laddar ner den.
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          else
            auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi
          result=$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --output-format json)
          printf '%s\n' "$result"
          if ! printf '%s' "$result" | grep -Eq '"status" *: *"Accepted"'; then
            echo "::error::Notariseringen av $dmg godkändes inte."
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          echo "Biljetten är fast häftad på $dmg."
      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel-installer
          path: freevobe-desktop/dist-release/*
          if-no-files-found: error

  linux:
    name: Linux (.AppImage)
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Systemberoenden för Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: freevobe-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freevobe-desktop/apps/desktop/src-tauri
      - run: npm ci
        working-directory: freevobe-desktop
      - name: Bygg agenten och sidecar-binären
        working-directory: freevobe-desktop
        run: npm run sidecar:build
      - name: Bygg installeraren
        working-directory: freevobe-desktop
        run: npm run tauri --workspace @freevobe/desktop -- build --bundles appimage
      - name: Döp artefakten till nedladdningssidans filnamn
        shell: bash
        working-directory: freevobe-desktop
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage \
            "dist-release/Freevobe_${GITHUB_REF_NAME}_amd64.AppImage"
          ls -l dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: freevobe-desktop/dist-release/*
          if-no-files-found: error

  android:
    name: Android (.apk)
    needs: verify
    runs-on: ubuntu-latest
    # Signering av release-APK:n. Utan hemligheterna signeras APK:n med debugnyckeln – installerbar
    # vid sidan om butiken, men inte publicerbar. Se docs/releasing.md.
    env:
      FREEVOBE_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      FREEVOBE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      FREEVOBE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      FREEVOBE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: freevobe-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Mobilappen körs på samma Node-version som CI-jobbet för den.
          node-version: 22
          cache: npm
          cache-dependency-path: freevobe-mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Ingen setup-android här: runnern har redan Android-SDK:t på plats (ANDROID_HOME), och
      # actionen byter ut cmdline-tools mot en version vars licenser inte är accepterade – då
      # fastnar bygget i Googles licensprompt i stället för att bygga.
      - run: npm ci
      - name: Generera Android-projektet
        run: npx expo prebuild --platform android --no-install
      - name: Skriv nyckellagret och key.properties
        shell: bash
        run: |
          set -euo pipefail
          # Nyckellagret läses av plugins/with-android-release-signing.js via android/key.properties.
          # Båda filerna ligger under android/, som prebuild skapar och .gitignore utesluter.
          if [ -z "${FREEVOBE_ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "FREEVOBE_ANDROID_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 saknas – APK:n signeras med debugnyckeln och kan inte publiceras i Play Store (se docs/releasing.md)."
            exit 0
          fi
          printf '%s' "$FREEVOBE_ANDROID_KEYSTORE_BASE64" | tr -d '\n' | base64 -d > android/app/upload-key.jks
          cat > android/key.properties <<EOF
          storeFile=app/upload-key.jks
          storePassword=$FREEVOBE_ANDROID_KEYSTORE_PASSWORD
          keyAlias=$FREEVOBE_ANDROID_KEY_ALIAS
          keyPassword=$FREEVOBE_ANDROID_KEY_PASSWORD
          EOF
          echo "FREEVOBE_ANDROID_SIGNED=true" >> "$GITHUB_ENV"
          echo "Nyckellagret är på plats (alias $FREEVOBE_ANDROID_KEY_ALIAS)."
      - name: Bygg APK
        working-directory: freevobe-mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Döp artefakten
        shell: bash
        working-directory: freevobe-mobile
        run: |
          set -euo pipefail
          mkdir -p dist-release
          version=$(node -p "require('./app.json').expo.version")
          # APK:ns egen version (app.json), inte releasetaggens version: det är den appen visar.
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist-release/Freevobe-Mobile_${version}.apk"
          ls -l dist-release
      - name: Verifiera signeringen
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME är inte satt – kan inte hitta apksigner."
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::Hittade ingen apksigner i $ANDROID_HOME/build-tools."
            exit 1
          fi
          certs=$("$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk)
          printf '%s\n' "$certs"
          if [ "${FREEVOBE_ANDROID_SIGNED:-false}" = "true" ]; then
            # Det här är kontrollen som faktiskt avgör om signeringen tog: att APK:n inte längre bär
            # debugnyckelns identitet.
            if printf '%s' "$certs" | grep -qi 'CN=Android Debug'; then
              echo "::error::APK:n är signerad med debugnyckeln trots att ett nyckellager skickades in."
              exit 1
            fi
            echo "APK:n är signerad med release-nyckeln."
          else
            if printf '%s' "$certs" | grep -qi 'CN=Android Debug'; then
              echo "::warning::APK:n är debug-signerad (förväntat utan nyckellagerhemlighet)."
            else
              echo "::error::APK:n är inte debug-signerad men inget nyckellager skickades in – kontrollera bygget."
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: freevobe-mobile/dist-release/*
          if-no-files-found: error

  release:
    name: Publicera releasen
    needs: [learn, windows, macos, macos_intel, linux, android]
    # En manuell körning används för att testa bygget och ska bara lämna artefakter – den får inte
    # skapa eller skriva om en release (en körning från en gren har inget taggnamn att publicera på).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Skriptet hämtas hit: jobbet checkar annars inte ut repot, och kontrollsummorna räknas i
      # den här workflowen (inte i byggjobben) så att de gäller exakt de bytes som publiceras.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Beräkna SHA-256 för filerna
        shell: bash
        run: bash .github/scripts/release-checksums.sh compute artifacts
      - name: Ladda upp filerna till releasen för taggen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l artifacts
          # --repo behövs: jobbet checkar inte ut repot, och gh letar annars efter ett lokalt
          # git-origin i arbetskatalogen.
          repo="$GITHUB_REPOSITORY"
          if gh release view "$GITHUB_REF_NAME" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$repo" --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$repo" \
              --title "Freevobe $GITHUB_REF_NAME" \
              --generate-notes
          fi
          # En release vars tagg har flyttats kan ha blivit ett utkast och tappat taggknytningen.
          # Publicera den därför alltid om, så att nedladdningssidan hittar filerna.
          gh release edit "$GITHUB_REF_NAME" --repo "$repo" --draft=false --latest
          gh release view "$GITHUB_REF_NAME" --repo "$repo" --json assets --jq '.assets[].name'

      # Summorna skrivs också in i releaseanteckningarna. GitHub-API:et svarar med CORS, men själva
      # filnedladdningen gör det inte – därför läser nedladdningssidan summorna ur releasens text i
      # stället för att hämta SHA256SUMS.txt i webbläsaren.
      - name: Skriv in kontrollsummorna i releaseanteckningarna
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bash .github/scripts/release-checksums.sh body
          "$GITHUB_REF_NAME" artifacts/SHA256SUMS.txt
