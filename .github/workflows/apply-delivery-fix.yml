name: Applicera leveransfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  applicera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Applicera patchen
        run: git apply --whitespace=nowarn .github/delivery-fix.patch
      - name: Installera beroenden
        working-directory: freevobe-desktop
        run: npm ci
      - name: Verifiera
        working-directory: freevobe-desktop
        run: npm run verify
      - name: Committa och pusha till main
        run: |
          git config user.name "Freevobe"
          git config user.email "vobefree@users.noreply.github.com"
          git rm --quiet .github/delivery-fix.patch .github/workflows/apply-delivery-fix.yml
          git add -A
          git commit -m "Låt en beställning bli filer i stället för kod i chatten"
          git push origin HEAD:main
