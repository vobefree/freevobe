# Bygger Intel-varianten av macOS-installeraren och lägger den i en befintlig release.
#
# Varför ett eget jobb: GitHub-runnern `macos-latest` är Apple Silicon, och sidobinären (agenten)
# paketeras med Node:s SEA på byggmaskinens arkitektur. En x64-dmg kräver därför en Intel-runner –
# annars blir agent-binären arm64 och appen startar inte på en Intel-Mac.
#
# Release-workflowen bygger den här varianten automatiskt när en tagg pushas. Den här filen finns
# för att kunna lägga till filen i en release som redan är publicerad, utan att bygga om allt.
name: macOS Intel (.dmg)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-tagg att lägga filen i (t.ex. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-intel-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # Samma version som sidecar-binären är verifierad med (Node:s SEA kräver >= 22.5).
  NODE_VERSION: 24

jobs:
  macos-intel:
    name: macOS (.dmg, Intel)
    runs-on: macos-15-intel
    # Koden-signering och notarisering, samma hemligheter som `macos`-jobbet i release.yml. Alla är
    # valfria: utan dem blir appen osignerad och Gatekeeper varnar vid start. VIBEFORGE_-prefixet
    # finns för att en tom APPLE_*-variabel får Tauri att försöka signera med ett tomt certifikat.
    env:
      VIBEFORGE_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      VIBEFORGE_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      VIBEFORGE_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      VIBEFORGE_APPLE_ID: ${{ secrets.APPLE_ID }}
      VIBEFORGE_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      VIBEFORGE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      VIBEFORGE_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      VIBEFORGE_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      VIBEFORGE_APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: vibeforge/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vibeforge/apps/desktop/src-tauri
      - run: npm ci
        working-directory: vibeforge
      - name: Bygg agenten och sidecar-binären
        working-directory: vibeforge
        run: npm run sidecar:build
      - name: Förbered signering
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          # Tauri läser APPLE_*-variablerna själv under bygget, så de behöver sina riktiga namn – men
          # bara när de har ett värde: en tom APPLE_CERTIFICATE eller APPLE_SIGNING_IDENTITY tolkas
          # som "signera med ett tomt certifikat" och fäller bygget.
          expose() {
            local name="$1"
            local value="${2:-}"
            [ -n "$value" ] || return 0
            printf '%s=%s\n' "$name" "$(printf '%s' "$value" | tr -d '\n')" >> "$GITHUB_ENV"
          }
          # Notarisering med App Store Connect-nyckel kräver .p8-filen på disk. Den skickas in som
          # base64 och läggs i runnerkontots tempkatalog – aldrig i repot.
          if [ -n "${VIBEFORGE_APPLE_API_KEY_P8_BASE64:-}" ]; then
            printf '%s' "$VIBEFORGE_APPLE_API_KEY_P8_BASE64" | tr -d '\n' \
              | openssl base64 -d -A > "$RUNNER_TEMP/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey.p8"
            expose APPLE_API_KEY_PATH "$RUNNER_TEMP/AuthKey.p8"
          fi
          expose APPLE_CERTIFICATE "${VIBEFORGE_APPLE_CERTIFICATE:-}"
          expose APPLE_CERTIFICATE_PASSWORD "${VIBEFORGE_APPLE_CERTIFICATE_PASSWORD:-}"
          expose APPLE_SIGNING_IDENTITY "${VIBEFORGE_APPLE_SIGNING_IDENTITY:-}"
          expose APPLE_ID "${VIBEFORGE_APPLE_ID:-}"
          expose APPLE_PASSWORD "${VIBEFORGE_APPLE_PASSWORD:-}"
          expose APPLE_TEAM_ID "${VIBEFORGE_APPLE_TEAM_ID:-}"
          expose APPLE_API_KEY "${VIBEFORGE_APPLE_API_KEY:-}"
          expose APPLE_API_ISSUER "${VIBEFORGE_APPLE_API_ISSUER:-}"
          if [ -n "${VIBEFORGE_APPLE_CERTIFICATE:-}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_CERTIFICATE saknas – appen blir osignerad och Gatekeeper varnar vid start (se docs/releasing.md)."
          fi
          if [ -n "${VIBEFORGE_APPLE_ID:-}" ] || [ -n "${VIBEFORGE_APPLE_API_KEY:-}" ]; then
            echo "notary=true" >> "$GITHUB_OUTPUT"
          else
            echo "notary=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Inga notariseringsuppgifter (APPLE_ID eller APPLE_API_KEY) – dmg:n lämnas onotariserad."
          fi

      - name: Bygg installeraren
        working-directory: vibeforge
        run: >-
          npm run tauri --workspace @vibeforge/desktop -- build
          --target x86_64-apple-darwin --bundles dmg
      - name: Döp artefakten till nedladdningssidans filnamn
        shell: bash
        working-directory: vibeforge
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg \
            "dist-release/Freevobe_${{ inputs.tag }}_x64.dmg"
          ls -l dist-release
      - name: Notarisera och häfta fast biljetten på dmg:n
        if: steps.signing.outputs.signed == 'true' && steps.signing.outputs.notary == 'true'
        shell: bash
        working-directory: vibeforge
        run: |
          set -euo pipefail
          dmg=$(ls dist-release/*.dmg)
          # Tauri notariserar och häftar appen, men inte dmg-filen (tauri-apps/tauri#7533). Utan
          # biljett på själva filen varnar Gatekeeper den som laddar ner den.
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          else
            auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi
          result=$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --output-format json)
          printf '%s\n' "$result"
          if ! printf '%s' "$result" | grep -Eq '"status" *: *"Accepted"'; then
            echo "::error::Notariseringen av $dmg godkändes inte."
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          echo "Biljetten är fast häftad på $dmg."
      - name: Lägg filen i releasen
        shell: bash
        working-directory: vibeforge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.tag }}" dist-release/* \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name'
      # Filen läggs i en release som redan är publicerad, så kontrollsumman för den måste in i
      # releasefilen och i anteckningarna – annars saknar nedladdningssidan summan för Intel-Macen.
      - name: Uppdatera kontrollsummorna
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          bash .github/scripts/release-checksums.sh add "$tag" \
            vibeforge/dist-release/*.dmg vibeforge/dist-release/SHA256SUMS.txt
          bash .github/scripts/release-checksums.sh body "$tag" \
            vibeforge/dist-release/SHA256SUMS.txt
