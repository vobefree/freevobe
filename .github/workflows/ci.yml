# Freevobes tre delar har var sin package.json och sitt eget lås, så varje jobb installerar bara sitt
# eget. Kommandona är exakt de som körs lokalt – inget extra som bara finns i CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freevobe-mobile:
    name: Freevobe Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freevobe-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: freevobe-mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint

  freevobe-desktop:
    name: Freevobe Desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freevobe-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: freevobe-desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Playwright-sviten (test:e2e) kräver nedladdade webbläsare och körs därför inte här.
      - run: npm test

  freevobe-learn:
    name: Freevobe Learn (appen)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freevobe-learn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: freevobe-learn/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  freevobe-web:
    name: Freevobe-sidan (webb)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freevobe-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: freevobe/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
